{% extends "base.html" %}
{% block title %}الگوها{% endblock %}
{% block content %}
<section class="page-header">
    <h2>الگوها</h2>
    <p>یک الگو را برای محاسبه انتخاب کنید.</p>
</section>

<div class="grid">
    {% for p in patterns %}
    <div class="card">
        <h3>{{ p.name }}</h3>
        <p>{{ p.description }}</p>
        <a class="btn btn-primary" href="{{ url_for('patterns.calculate', code=p.code) }}">محاسبه</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
